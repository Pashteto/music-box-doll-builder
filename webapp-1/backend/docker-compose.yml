# Shared log-rotation policy (json-file, ≤3 × 10 MB per container).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_USER: dev
      POSTGRES_DB: dollbuilder_dev
    volumes:
      - ./data/db/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    logging: *default-logging
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  migrate:
    image: migrate/migrate
    logging: *default-logging
    depends_on:
      - postgres
    volumes:
      - ./db/migrations:/migrations
    command: ["-path=/migrations", "-database", "postgres://dev:dev@postgres:5432/dollbuilder_dev?sslmode=disable", "up"]

  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"   # HTTP REST API
      - "9090:9090"   # gRPC
    environment:
      # Database configuration
      DATABASE_ENABLED: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: dev
      DATABASE_PASSWORD: dev
      DATABASE_NAME: dollbuilder_dev
      # HTTP REST API configuration
      HTTP_ENABLED: "true"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: 8080
      HTTP_MOCK_AUTH: "true"  # Bypass JWT validation for local dev
      # gRPC configuration
      GRPC_ENABLED: "true"
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: 9090
      # Cache (Redis) configuration
      CACHE_ENABLED: "true"
      CACHE_HOST: redis
      CACHE_PORT: "6379"
      # Prometheus metrics on an internal-only port.
      METRICS_ENABLED: "true"
      METRICS_PORT: "9100"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=256MB"
    # Host UI port 9091 (dev gRPC already owns host 9090).
    ports:
      - "127.0.0.1:9091:9090"
