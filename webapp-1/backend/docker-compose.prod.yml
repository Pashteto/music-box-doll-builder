# Production compose for oracle-1. Hardened vs the dev docker-compose.yml:
#   - no host-exposed Postgres/Redis ports (internal docker network only)
#   - app bound to 127.0.0.1 only (nginx terminates TLS and reverse-proxies)
#   - mock auth OFF, gRPC OFF, Secure cookies, CORS locked to the frontend origin
#   - secrets come from a server-side .env file (NOT committed) — see .env.prod.example
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d --build

# Shared log-rotation policy: cap container logs so the host disk can't fill up
# (json-file driver, ≤3 files × 10 MB = ≤30 MB per container).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  migrate:
    image: migrate/migrate
    logging: *default-logging
    depends_on:
      - postgres
    volumes:
      - ./db/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database",
        "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable",
        "up",
      ]

  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - postgres
      - redis
    # Bind to loopback only; nginx on the host proxies to this.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_ENABLED: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
      DATABASE_SSL_MODE: disable

      HTTP_ENABLED: "true"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8080"
      HTTP_MOCK_AUTH: "false"

      # CORS — only the deployed frontend, with credentials (cookies)
      HTTP_CORS_ALLOWED_ORIGINS: "https://lindentar.pashteto.com"
      HTTP_CORS_ALLOW_CREDENTIALS: "true"

      # gRPC not used by the web app
      GRPC_ENABLED: "false"

      # Redis session cache + login rate-limit
      CACHE_ENABLED: "true"
      CACHE_HOST: redis
      CACHE_PORT: "6379"

      # Session cookie — Secure (HTTPS) in prod; host-only (api.lindentar.pashteto.com)
      AUTH_COOKIE_DOMAIN: ""
      AUTH_COOKIE_SECURE: "true"
      AUTH_SESSION_TTL: "720h"

      # Stripe / entitlements (Plan 3). Keys come from the server-side .env (never
      # committed). Empty secret key => checkout returns 503 and the webhook is
      # not wired, so the app stays healthy until keys are provided.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_SUCCESS_URL: "https://lindentar.pashteto.com/editor?checkout=success"
      STRIPE_CANCEL_URL: "https://lindentar.pashteto.com/editor"
      # Mock checkout MUST be off in production (real Stripe only).
      ALLOW_MOCK_CHECKOUT: "false"

      # Prometheus metrics on an internal-only port (NEVER published to the host).
      METRICS_ENABLED: "true"
      METRICS_PORT: "9100"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      # retention.size is the hard cap that stops the TSDB volume growing forever;
      # Prometheus drops the oldest blocks once 512MB (or 15 days) is reached.
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=512MB"
    # UI bound to loopback only; nginx proxies a public subdomain with basic auth.
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  pgdata:
  promdata:
